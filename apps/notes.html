<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notes</title>
<link rel="stylesheet" href="app.css">
<style>
  .notes { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .notes textarea {
    flex: 1; resize: none; background: rgba(14, 12, 9, 0.6); color: var(--txt);
    border: 1px solid var(--line); border-radius: 11px; padding: 13px;
    font-family: var(--mono); font-size: 13px; line-height: 1.6; outline: none;
    transition: border-color .15s;
  }
  .notes textarea:focus { border-color: rgba(255, 166, 61, 0.5); }
  .notes .meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--dim); }
  .notes .meta button {
    border: 1px solid var(--line); background: rgba(255, 196, 140, 0.08); color: var(--dim);
    border-radius: 8px; padding: 5px 14px; cursor: pointer; font-size: 11px; font-weight: 700;
    transition: background .1s, color .1s;
  }
  .notes .meta button:hover { background: rgba(229, 72, 77, 0.2); color: var(--ember); border-color: rgba(229, 72, 77, 0.4); }
</style>
</head>
<body>
<div class="app notes">
  <div class="appbar"><b>scratchpad</b> · autosaves as u type</div>
  <textarea id="nt" placeholder="drop ur thoughts here. saves itself. fr."></textarea>
  <div class="meta"><span id="nbchars">0 chars</span><button id="nbclear">clear everything</button></div>
</div>
<script>
var ta = document.getElementById("nt");
var cnt = document.getElementById("nbchars");
ta.value = localStorage.getItem("kubo_note") || "";
cnt.textContent = ta.value.length + " chars";
var timer = null;
ta.addEventListener("input", function () {
  localStorage.setItem("kubo_note", ta.value);
  cnt.textContent = ta.value.length + " chars";
  if (!timer) {
    timer = setTimeout(function () {
      timer = null;
      var p = window.parent;
      if (p && p.kuboOS) p.kuboOS.toast("note <b>saved</b>");
    }, 900);
  }
});
document.getElementById("nbclear").onclick = function () {
  var p = window.parent;
  function wipe() {
    ta.value = "";
    localStorage.setItem("kubo_note", "");
    cnt.textContent = "0 chars";
    if (p && p.kuboOS) p.kuboOS.toast("scratchpad <b>wiped</b> clean");
  }
  if (p && p.kuboOS) p.kuboOS.ask("wipe ur whole scratchpad? no undo, bro.", wipe);
  else wipe();
};
</script>
</body>
</html>
