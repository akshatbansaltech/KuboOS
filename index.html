<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuboOS</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap");
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0e0c09;
    --panel: rgba(24, 20, 15, 0.85);
    --panel2: rgba(30, 25, 19, 0.92);
    --line: rgba(255, 196, 140, 0.14);
    --txt: #f4ecdd;
    --dim: #a59880;
    --amber: #ffa63d;
    --ember: #f2703f;
    --gold: #f2c14e;
    --ink: #1d1508;
    --font: "Inter", "Segoe UI", system-ui, sans-serif;
    --disp: "Space Grotesk", "Inter", "Segoe UI", sans-serif;
    --mono: "Cascadia Code", Consolas, "Courier New", monospace;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--txt);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  ::selection { background: var(--amber); color: var(--ink); }

  /* ---------- wallpaper ---------- */
  #wallpaper {
    position: fixed; inset: 0;
    background: linear-gradient(rgba(6, 9, 16, 0.42), rgba(6, 9, 16, 0.72)),
      url("wallpaper.jpg") center / cover no-repeat var(--bg);
  }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(4, 6, 10, 0.55) 100%);
  }
  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 196, 140, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 196, 140, 0.05) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse at 50% 45%, black 25%, transparent 72%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 45%, black 25%, transparent 72%);
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(100px); animation: drift 16s ease-in-out infinite alternate; }
  .orb.a { width: 420px; height: 420px; background: var(--amber); top: 6%; left: 5%; opacity: 0.13; }
  .orb.b { width: 460px; height: 460px; background: var(--ember); bottom: 4%; right: 6%; opacity: 0.12; animation-delay: -6s; }
  .orb.c { width: 340px; height: 340px; background: var(--gold); top: 42%; left: 55%; opacity: 0.08; animation-delay: -10s; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(44px, -34px) scale(1.18); } }

  /* ---------- desktop icons ---------- */
  #icons {
    position: absolute; top: 20px; left: 18px;
    display: flex; flex-direction: column; gap: 4px; z-index: 5;
  }
  .dicon {
    width: 96px; padding: 10px 6px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    cursor: pointer; font-size: 11.5px; font-weight: 600; color: var(--txt);
    text-align: center; border: 1px solid transparent;
    transition: background .12s, border-color .12s, transform .1s;
  }
  .dicon:hover { background: rgba(30, 25, 19, 0.55); border-color: var(--line); transform: translateY(-2px); }
  .dicon:active { transform: scale(0.94); }
  .dicon .ico {
    width: 46px; height: 46px; border-radius: 13px;
    display: grid; place-items: center; font-size: 13px; font-weight: 800;
    font-family: var(--mono); color: var(--ink);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  /* ---------- windows ---------- */
  #windows { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  .win {
    position: absolute; min-width: 280px; min-height: 170px;
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 20px 55px rgba(0, 0, 0, 0.55);
    display: flex; flex-direction: column; overflow: hidden;
    pointer-events: auto;
    animation: winin 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    transition: box-shadow .18s, border-color .18s;
  }
  @keyframes winin { from { opacity: 0; transform: scale(0.92) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .win.focused { border-color: rgba(255, 166, 61, 0.5); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 166, 61, 0.22), 0 0 34px rgba(255, 166, 61, 0.16); }
  .win.maximized { inset: 0 !important; width: auto !important; height: auto !important; border-radius: 0; }
  .win.dragging .titlebar { cursor: grabbing; }
  .titlebar {
    height: 40px; flex: 0 0 40px; display: flex; align-items: center; gap: 9px;
    padding: 0 8px 0 12px; cursor: grab; touch-action: none;
    background: linear-gradient(180deg, rgba(52, 66, 94, 0.35), rgba(52, 66, 94, 0.08));
    border-bottom: 1px solid var(--line);
  }
  .win:not(.focused) .titlebar { opacity: 0.75; }
  .tchip {
    width: 22px; height: 22px; border-radius: 7px; flex: 0 0 22px;
    display: grid; place-items: center; font-size: 9px; font-weight: 800;
    font-family: var(--mono); color: var(--ink);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .title { flex: 1; font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
  .tb-btn {
    width: 32px; height: 27px; border: none; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--dim); font-size: 12px; line-height: 1;
    display: grid; place-items: center; transition: background .1s, color .1s, transform .08s;
  }
  .tb-btn:hover { background: rgba(255, 196, 140, 0.2); color: var(--txt); transform: translateY(-1px); }
  .tb-btn:active { transform: scale(0.9); }
  .tb-btn.close:hover { background: #e5484d; color: #fff; }
  .wframe { flex: 1; width: 100%; border: none; background: transparent; }
  .resizer {
    position: absolute; right: 0; bottom: 0; width: 18px; height: 18px;
    cursor: nwse-resize; touch-action: none;
  }
  .resizer::after {
    content: ""; position: absolute; right: 5px; bottom: 5px;
    width: 8px; height: 8px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim);
    border-radius: 0 0 3px 0; opacity: 0.45;
  }

  /* ---------- taskbar ---------- */
  #taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 54px; z-index: 100;
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: rgba(9, 12, 20, 0.78);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-top: 1px solid var(--line);
  }
  #kubo {
    width: 42px; height: 42px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--amber), var(--gold));
    display: grid; place-items: center; font-weight: 800; font-size: 16px; color: var(--ink);
    box-shadow: 0 4px 16px rgba(255, 166, 61, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    transition: transform .12s, filter .12s; position: relative;
  }
  #kubo:hover { transform: scale(1.08) rotate(-4deg); filter: brightness(1.1); }
  #kubo .cube { font-family: var(--mono); }
  #kubo.badge::after {
    content: ""; position: absolute; top: -3px; right: -3px; width: 11px; height: 11px;
    background: var(--ember); border-radius: 50%; border: 2px solid #0e0c09;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  #runbtns { flex: 1; display: flex; gap: 7px; overflow-x: auto; align-items: center; }
  #runbtns::-webkit-scrollbar { height: 0; }
  .rbtn {
    height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
    background: rgba(255, 196, 140, 0.07); color: var(--txt);
    font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px;
    white-space: nowrap; transition: background .12s, transform .08s, opacity .12s;
    font-family: var(--font);
  }
  .rbtn:hover { background: rgba(255, 196, 140, 0.18); transform: translateY(-1px); }
  .rbtn:active { transform: scale(0.96); }
  .rbtn.active { background: rgba(255, 166, 61, 0.12); border-color: rgba(255, 166, 61, 0.35); }
  .rbtn.min { opacity: 0.55; }
  .rbtn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 6px rgba(255, 166, 61, 0.8); }
  .rbtn.min .dot { background: var(--dim); box-shadow: none; }
  #clock {
    padding: 4px 10px; text-align: right; font-size: 11px; color: var(--dim); line-height: 1.4;
    border-left: 1px solid var(--line); margin-left: 2px; border-radius: 8px;
    transition: background .12s;
  }
  #clock:hover { background: rgba(255, 196, 140, 0.08); }
  #clock .t { font-weight: 700; font-size: 14px; color: var(--txt); font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
  #clock .t i { font-style: normal; color: var(--amber); }
  #clock .d { color: var(--dim); }

  /* ---------- start menu ---------- */
  #startmenu {
    position: fixed; left: 12px; bottom: 64px; width: 360px; z-index: 99;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.6); padding: 16px;
    display: none; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    animation: menuin 0.16s ease-out;
  }
  @keyframes menuin { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  #startmenu.open { display: block; }
  #smhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #smhead .cube {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--amber), var(--gold));
    font-family: var(--mono); font-weight: 800; color: var(--ink); font-size: 15px;
  }
  #smhead .who { font-size: 13px; font-weight: 700; }
  #smhead .sub { font-size: 10.5px; color: var(--dim); }
  #smgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .smitem {
    display: flex; align-items: center; gap: 10px; padding: 10px;
    border: 1px solid var(--line); border-radius: 11px; cursor: pointer;
    background: rgba(255, 196, 140, 0.05); transition: background .1s, transform .06s;
  }
  .smitem:hover { background: rgba(255, 196, 140, 0.15); transform: scale(1.02); }
  .smitem .ico {
    width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 10px; font-weight: 800;
    font-family: var(--mono); color: var(--ink);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .smitem .nm { font-size: 12.5px; font-weight: 600; }
  #smfoot { margin-top: 12px; font-size: 10px; color: var(--dim); text-align: center; font-family: var(--mono); }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; right: 14px; bottom: 66px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .toast {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 16px; font-size: 12.5px; font-weight: 600; color: var(--txt);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5); cursor: pointer;
    animation: toastin 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    max-width: 300px; backdrop-filter: blur(16px);
  }
  .toast.bye { animation: toastout 0.25s ease-in forwards; }
  .toast b { color: var(--amber); }
  @keyframes toastin { from { opacity: 0; transform: translateX(30px) scale(0.95); } to { opacity: 1; transform: none; } }
  @keyframes toastout { to { opacity: 0; transform: translateX(30px) scale(0.95); } }

  /* ---------- modal ---------- */
  #modal {
    position: fixed; inset: 0; z-index: 400; display: none; place-items: center;
    background: rgba(4, 6, 10, 0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #modal.open { display: grid; }
  #modal .box {
    width: 320px; background: var(--panel2); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65);
    animation: menuin 0.18s ease-out;
  }
  #modal .box p { font-size: 13.5px; line-height: 1.6; margin-bottom: 18px; }
  #modal .btns { display: flex; gap: 8px; justify-content: flex-end; }
  #modal button {
    border: 1px solid var(--line); background: rgba(255, 196, 140, 0.1); color: var(--txt);
    border-radius: 9px; padding: 7px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    transition: background .1s, transform .06s;
  }
  #modal button:hover { background: rgba(255, 196, 140, 0.22); transform: translateY(-1px); }
  #modal button.ok { background: linear-gradient(135deg, #e5484d, #ff7b6b); color: #fff; border: none; }

  /* ---------- boot ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 999; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    transition: opacity .6s; cursor: wait;
  }
  #boot .logo {
    font-family: var(--disp); font-weight: 700; font-size: 54px; letter-spacing: 3px;
    background: linear-gradient(90deg, var(--amber), var(--ember), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: bootglow 1.8s ease-in-out infinite alternate;
  }
  @keyframes bootglow { from { opacity: 0.85; } to { opacity: 1; } }
  #bootbar { width: 280px; height: 6px; border-radius: 3px; background: rgba(255, 196, 140, 0.14); overflow: hidden; }
  #bootbar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--amber), var(--ember)); transition: width .3s; border-radius: 3px; }
  #boot .txt { font-size: 11.5px; color: var(--dim); font-family: var(--mono); letter-spacing: 1px; }
</style>
</head>
<body>

<div id="wallpaper">
  <div id="grid"></div>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
  <div id="vignette"></div>
</div>

<div id="icons"></div>
<div id="windows"></div>

<div id="taskbar">
  <button id="kubo" title="kubo menu"><span class="cube">K</span></button>
  <div id="runbtns"></div>
  <div id="clock"><div class="t">--:--:--</div><div class="d">----</div></div>
</div>

<div id="startmenu">
  <div id="smhead">
    <span class="cube">K</span>
    <div><div class="who" id="smwho">hey, there</div><div class="sub">kubo os · v2.0</div></div>
  </div>
  <div id="smgrid"></div>
  <div id="smfoot">no password. no rules. just vibes.</div>
</div>

<div id="toasts"></div>
<div id="modal"><div class="box"><p id="modal-text"></p><div class="btns"><button id="modal-cancel">nah</button><button class="ok" id="modal-ok">yeah</button></div></div></div>

<div id="boot">
  <div class="logo">KUBO//OS</div>
  <div id="bootbar"><i></i></div>
  <div class="txt" id="boottxt">powering up...</div>
</div>

<script>
(function () {
  "use strict";

  var GRADS = {
    hello: "linear-gradient(135deg,#ffd166,#ff9e42)",
    notes: "linear-gradient(135deg,#a7c957,#6a994e)",
    calc:  "linear-gradient(135deg,#e76f51,#c0472f)",
    term:  "linear-gradient(135deg,#8d6e63,#5d4037)",
    about: "linear-gradient(135deg,#d4a373,#a97c50)"
  };

  var APPS = [
    { id: "hello",  name: "Welcome",    icon: "WE", src: "apps/hello.html", w: 480, h: 460 },
    { id: "notes",  name: "Notes",      icon: "NT", src: "apps/notes.html", w: 460, h: 420 },
    { id: "calc",   name: "Calculator", icon: "CA", src: "apps/calc.html",  w: 300, h: 440 },
    { id: "term",   name: "Terminal",   icon: "TR", src: "apps/term.html",  w: 560, h: 380 },
    { id: "about",  name: "About",      icon: "AB", src: "apps/about.html", w: 420, h: 430 }
  ];

  var windows = {};
  var zTop = 100;
  var nextX = 90, nextY = 55;

  function toast(msg) {
    var t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = msg;
    t.onclick = function () { dismiss(t); };
    document.getElementById("toasts").appendChild(t);
    setTimeout(function () { dismiss(t); }, 3200);
    function dismiss(el) {
      el.classList.add("bye");
      setTimeout(function () { el.remove(); }, 250);
    }
  }

  function ask(text, onOk) {
    var m = document.getElementById("modal");
    document.getElementById("modal-text").textContent = text;
    var ok = document.getElementById("modal-ok");
    var cancel = document.getElementById("modal-cancel");
    function close() {
      m.classList.remove("open");
      ok.onclick = cancel.onclick = null;
      document.removeEventListener("keydown", esc);
    }
    function esc(e) { if (e.key === "Escape") close(); }
    ok.onclick = function () { close(); onOk && onOk(); };
    cancel.onclick = close;
    document.addEventListener("keydown", esc);
    m.classList.add("open");
    ok.focus();
  }

  /* ============ window manager ============ */
  function openApp(id) {
    var app = null;
    for (var i = 0; i < APPS.length; i++) if (APPS[i].id === id) app = APPS[i];
    if (!app) return;
    if (windows[id]) { focusWin(id); return; }

    var win = document.createElement("div");
    win.className = "win";
    win.id = "win-" + id;
    win.style.width = app.w + "px";
    win.style.height = app.h + "px";
    win.style.left = Math.min(nextX, Math.max(10, window.innerWidth - app.w - 30)) + "px";
    win.style.top = Math.min(nextY, window.innerHeight - app.h - 90) + "px";
    nextX = (nextX + 45) % (window.innerWidth - 360) + 20;
    nextY = (nextY + 45) % (window.innerHeight - 300) + 20;

    var tbar = document.createElement("div");
    tbar.className = "titlebar";
    tbar.innerHTML = '<span class="title"><span class="tchip" style="background:' + GRADS[id] + '">' + app.icon + '</span>' + app.name + "</span>";
    var btnMax = document.createElement("button");
    btnMax.className = "tb-btn"; btnMax.innerHTML = "▢"; btnMax.title = "maximize (double-click bar)";
    var btnMin = document.createElement("button");
    btnMin.className = "tb-btn"; btnMin.innerHTML = "&minus;"; btnMin.title = "minimize";
    var btnClose = document.createElement("button");
    btnClose.className = "tb-btn close"; btnClose.innerHTML = "✕"; btnClose.title = "close";
    tbar.appendChild(btnMin); tbar.appendChild(btnMax); tbar.appendChild(btnClose);

    var frame = document.createElement("iframe");
    frame.className = "wframe";
    frame.src = app.src;
    frame.title = app.name;

    var resizer = document.createElement("div");
    resizer.className = "resizer";

    win.appendChild(tbar); win.appendChild(frame); win.appendChild(resizer);
    document.getElementById("windows").appendChild(win);

    windows[id] = { win: win, frame: frame, minimized: false };

    frame.addEventListener("load", function () {
      try {
        frame.contentWindow.addEventListener("pointerdown", function () { focusWin(id); }, true);
      } catch (e) {}
    });

    addRunBtn(id, app);
    makeDraggable(win, tbar);
    makeResizable(win, resizer);

    btnClose.onclick = function () { closeApp(id); };
    btnMin.onclick = function () { minimizeApp(id); };
    btnMax.onclick = function () { maximizeApp(id); };
    tbar.ondblclick = function () { maximizeApp(id); };
    win.addEventListener("pointerdown", function () { focusWin(id); });

    focusWin(id);
  }

  function focusWin(id) {
    var w = windows[id]; if (!w) return;
    w.minimized = false;
    w.win.classList.add("focused");
    w.win.style.display = "flex";
    zTop += 1;
    w.win.style.zIndex = zTop;
    for (var k in windows) if (k !== id) windows[k].win.classList.remove("focused");
    paintRunBtns();
    document.getElementById("kubo").classList.remove("badge");
  }

  function minimizeApp(id) {
    var w = windows[id]; if (!w) return;
    w.minimized = true;
    w.win.style.display = "none";
    document.getElementById("kubo").classList.add("badge");
    paintRunBtns();
  }

  function maximizeApp(id) {
    var w = windows[id]; if (!w) return;
    w.win.classList.toggle("maximized");
    paintRunBtns();
  }

  function closeApp(id) {
    var w = windows[id]; if (!w) return;
    w.win.remove();
    delete windows[id];
    var b = document.querySelector('.rbtn[data-id="' + id + '"]');
    if (b) b.remove();
  }

  function makeDraggable(win, tbar) {
    tbar.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".tb-btn")) return;
      var wasMax = win.classList.contains("maximized");
      if (wasMax) {
        win.classList.remove("maximized");
        win.style.width = Math.min(820, window.innerWidth * 0.7) + "px";
        win.style.height = Math.min(560, window.innerHeight * 0.7) + "px";
        win.style.left = Math.max(10, e.clientX - win.offsetWidth / 2) + "px";
        win.style.top = Math.max(4, e.clientY - 22) + "px";
      }
      var sx = e.clientX, sy = e.clientY;
      var ox = win.offsetLeft, oy = win.offsetTop;
      win.classList.add("dragging");
      var mv = function (ev) {
        win.style.left = Math.max(-win.offsetWidth + 80, Math.min(window.innerWidth - 40, ox + ev.clientX - sx)) + "px";
        win.style.top = Math.max(0, Math.min(window.innerHeight - 60, oy + ev.clientY - sy)) + "px";
      };
      var up = function (ev) {
        win.classList.remove("dragging");
        window.removeEventListener("pointermove", mv);
        window.removeEventListener("pointerup", up);
        if (!wasMax && !win.classList.contains("maximized") && ev.clientY <= 10) maximizeApp(win.id.replace("win-", ""));
      };
      window.addEventListener("pointermove", mv);
      window.addEventListener("pointerup", up);
    });
  }

  function makeResizable(win, rz) {
    rz.addEventListener("pointerdown", function (e) {
      var sx = e.clientX, sy = e.clientY;
      var ow = win.offsetWidth, oh = win.offsetHeight;
      var mv = function (ev) {
        win.style.width = Math.max(280, ow + ev.clientX - sx) + "px";
        win.style.height = Math.max(170, oh + ev.clientY - sy) + "px";
      };
      var up = function () {
        window.removeEventListener("pointermove", mv);
        window.removeEventListener("pointerup", up);
      };
      window.addEventListener("pointermove", mv);
      window.addEventListener("pointerup", up);
    });
  }

  /* ============ taskbar ============ */
  function addRunBtn(id, app) {
    var b = document.createElement("button");
    b.className = "rbtn";
    b.dataset.id = id;
    b.title = app.name;
    b.innerHTML = '<span class="dot"></span>' + app.icon + " " + app.name;
    b.onclick = function () {
      var w = windows[id];
      if (w && w.minimized) focusWin(id);
      else if (w && w.win.classList.contains("focused")) minimizeApp(id);
      else if (w) focusWin(id);
      else openApp(id);
    };
    document.getElementById("runbtns").appendChild(b);
    paintRunBtns();
  }

  function paintRunBtns() {
    for (var k in windows) {
      var b = document.querySelector('.rbtn[data-id="' + k + '"]');
      if (!b) continue;
      var w = windows[k];
      b.classList.toggle("active", !w.minimized && w.win.classList.contains("focused"));
      b.classList.toggle("min", w.minimized);
    }
  }

  /* ============ clock ============ */
  function tick() {
    var n = new Date();
    var h = String(n.getHours()).padStart(2, "0");
    var m = String(n.getMinutes()).padStart(2, "0");
    var s = String(n.getSeconds()).padStart(2, "0");
    var days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
    var months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
    document.querySelector("#clock .t").innerHTML = h + ":" + m + ':<i>' + s + "</i>";
    document.querySelector("#clock .d").textContent = days[n.getDay()] + ", " + n.getDate() + " " + months[n.getMonth()] + " " + n.getFullYear();
  }
  setInterval(tick, 1000);
  tick();

  /* ============ start menu + desktop icons ============ */
  var smgrid = document.getElementById("smgrid");
  var icoGrid = document.getElementById("icons");
  APPS.forEach(function (a) {
    var si = document.createElement("div");
    si.className = "smitem";
    si.innerHTML = '<span class="ico" style="background:' + GRADS[a.id] + '">' + a.icon + '</span><span class="nm">' + a.name + "</span>";
    si.onclick = function () { toggleMenu(false); openApp(a.id); };
    smgrid.appendChild(si);

    var di = document.createElement("div");
    di.className = "dicon";
    di.innerHTML = '<span class="ico" style="background:' + GRADS[a.id] + '">' + a.icon + "</span><span>" + a.name + "</span>";
    di.onclick = function () { openApp(a.id); };
    icoGrid.appendChild(di);
  });

  var kubo = document.getElementById("kubo");
  kubo.onclick = function (e) { e.stopPropagation(); toggleMenu(); };
  function toggleMenu(force) {
    var sm = document.getElementById("startmenu");
    var open = force === undefined ? !sm.classList.contains("open") : force;
    sm.classList.toggle("open", open);
    if (open) {
      kubo.classList.remove("badge");
      document.getElementById("smwho").textContent = "hey, " + storedName;
    }
  }
  document.addEventListener("pointerdown", function (e) {
    if (!e.target.closest("#startmenu") && !e.target.closest("#kubo")) toggleMenu(false);
  });

  /* ============ boot ============ */
  function doBoot() {
    var lines = ["powering up...", "loading pages (all 7 of them)...", "polishing pixels...", "sheesh, almost done...", "sup, " + storedName + "."];
    var boot = document.getElementById("boot");
    boot.style.display = "flex";
    var bar = document.querySelector("#bootbar i");
    var txt = document.getElementById("boottxt");
    var p = 0, li = 0;
    txt.textContent = lines[0];
    var iv = setInterval(function () {
      p += 6 + Math.random() * 16;
      if (p > 30 && li < 1) { li = 1; txt.textContent = lines[1]; }
      else if (p > 55 && li < 2) { li = 2; txt.textContent = lines[2]; }
      else if (p > 78 && li < 3) { li = 3; txt.textContent = lines[3]; }
      if (p >= 100) {
        p = 100; clearInterval(iv);
        txt.textContent = lines[4];
        boot.style.opacity = "0";
        setTimeout(function () {
          boot.remove();
          if (!localStorage.getItem("kubo_welcomed")) {
            localStorage.setItem("kubo_welcomed", "1");
            openApp("hello");
            toast("u in, <b>" + storedName + "</b>. no password, no drama. just vibes.");
          }
        }, 600);
      }
      bar.style.width = p + "%";
    }, 100);
  }

  /* ============ resize handling ============ */
  window.addEventListener("resize", function () {
    for (var k in windows) {
      var w = windows[k].win;
      if (w.classList.contains("maximized")) continue;
      w.style.left = Math.max(0, Math.min(parseInt(w.style.left) || 0, window.innerWidth - 120)) + "px";
      w.style.top = Math.max(0, Math.min(parseInt(w.style.top) || 0, window.innerHeight - 120)) + "px";
    }
  });

  /* ============ boot flow ============ */
  var storedName = localStorage.getItem("kubo_name") || "";
  if (!storedName) {
    window.location.replace("lockscreen.html");
    return;
  }
  doBoot();

  /* ============ api for app pages ============ */
  window.kuboOS = { openApp: openApp, toast: toast, ask: ask };
})();
</script>
</body>
</html>
